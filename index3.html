<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilo/style3.css">
  <title>Document</title>
</head>
<body>
  <!-- Normal Flow -->
  <div>
    texto 1
  </div>
  <div>
    <span>
      texto 2
    </span>
    texto 3
  </div>
  <!-- Table -->
  <table>
    <tr>
      <td>L1C1</td>
      <td>L1C2</td>
    </tr>
    <tr>
      <td>L2C1</td>
      <td>L2C2</td>
    </tr>
  </table>
  <!-- Tableless -->
  <div style="float: left">conteudo 1</div>
  <div style="float: right">conteudo 2</div>
  <div style="clear: both">conteudo 3</div>
  <!-- Flexbox -->
   <div class="container1">
    <span>1</span>
    <div>2</div>
    <span>3</span>
    <span>4</span>
   </div>
   <!-- Grid -->
   <div class="container2">
    <span>1</span>
    <div>2</div>
    <span>3</span>
    <span>4</span>
   </div>
</body>
</html>
